# P1 Security - Part B: the security drone.   The ONLY file you change.
# After each change: save (Ctrl+S), then run again:   python3 ~/labs/projects/P1_security/partB/run.py
# Rules: keep the spaces at the start of the lines and the space after each colon.

label: alarm check           # a short name for this run - it becomes a row of your results table

speed: 2.0                   # cruise speed of the drone in m/s (try 1.0, 2.0, 3.0)

stop_bridge_after_waypoint: 0   # 0 = a normal flight. 1 = after the 1st alarm, the AirSim bridge is switched off in
                                #     mid-air (a sensor failure): the safety watchdog must land the drone

watchdog_seconds: 1.0        # how long the drone may fly without position data before it lands (try 0.5, 1.0, 2.0)

scale: 3.0                   # your building's map is this many times bigger outside (3 = a 10 m room becomes 30 m)

use_course_example: false    # true = use the course's example alarm log instead of yours (only if Part A failed)
