# P5 Collision avoidance - Part A: the robot that cannot crash.   The ONLY file you change.
# After each change: save (Ctrl+S), then run again:   python3 ~/labs/projects/P5_collision_avoidance/partA/run.py
# Rules: keep the spaces at the start of the lines and the space after each colon.

label: stop 0.45 m           # a short name for this run - it becomes a row of your results table

stop_distance: 0.45          # metres: the safety brick blocks any motion towards an obstacle closer than this
                             # (try 0.30, 0.45, 0.60)

speeds: [0.1, 0.2, 0.3]      # the speeds (m/s) the robot drives at the obstacle

repeats: 2                   # how many times each speed is tested
